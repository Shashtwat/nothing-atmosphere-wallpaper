name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. The more specific you are, the faster this gets fixed.
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > Apps > Nothing Atmosphere
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Unlock animation
        - Lock screen
        - Home screen
        - Picking or applying a wallpaper
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A screen recording helps a lot for animation issues.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "adb logcat | grep -E 'Atmosphere|AndroidRuntime'"
      render: text
